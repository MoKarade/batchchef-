name: CI

# Ce dépôt est PUBLIC et n'avait AUCUNE vérification automatisée. C'est en partie
# pourquoi une injection SQL par identifiants mal échappés (drizzle-orm < 0.45.2,
# GHSA-gpj5-g38j-94v9, HIGH) a vécu en production sans que rien ne se déclenche : elle
# n'a été découverte qu'en installant Drizzle dans un AUTRE dépôt (PR #22).
#
# Le job `gate` rejoue EXACTEMENT le gate du CLAUDE.md :
#   cd web && npm run typecheck && npm run test && npm run build
on:
  push:
    # La branche par défaut est `master`. Ne pas ajouter `main` ici : ce n'est pas un
    # tronc de ce projet mais une HISTOIRE SANS ANCÊTRE COMMUN — le BatchChef d'avant la
    # reprise sous `web/`, conservé sur `archive/pre-web-2026-04-24` (cf. CLAUDE.md §5).
    # Une CI verte sur une branche qui n'est pas le tronc est un signal faux.
    branches: [master]
  pull_request:
  # Le cron ne sert qu'au job `audit` : une vulnérabilité paraît sans qu'une ligne
  # n'ait changé — c'est précisément le mode de découverte qui a manqué ici.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toute l'app vit dans `web/` (CLAUDE.md) : la racine ne porte que la documentation.
defaults:
  run:
    working-directory: web

jobs:
  gate:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 58 s observe.
    timeout-minutes: 15
    name: Gate (typecheck · tests · build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push`, de `git commit` ni d'appel `gh` — `ci.yml` est le seul workflow.
          # Aucun n'a donc besoin du jeton persisté.
          persist-credentials: false

      # La convention de compte-rendu est une COPIE synchronisée de
      # claude-config/conventions/COMPTE-RENDU.md — un CLAUDE.md ne charge rien hors de son
      # arbre, donc le renvoi seul ne chargerait rien. Une copie sans contrôle redevient une
      # variante locale en silence : c'est le mode de panne que ce pas rend bruyant.
      # Pour la faire évoluer : modifier la SOURCE, propager, mettre à jour cette empreinte.
      - name: La convention de compte-rendu n'a pas dérivé
        # `defaults.run.working-directory: web` s'applique à CE pas aussi. La convention vit
        # à la RACINE (« la racine ne porte que la documentation », ci-dessus), donc il faut
        # sortir de `web/` explicitement — sans ça le fichier est introuvable et le pas
        # échoue en accusant une dérive qui n'existe pas. Vécu au premier run, 21/08/2026.
        working-directory: ${{ github.workspace }}
        run: echo "97e36acba8770c9614b6295773267b9690d07bc5bcd130b3bc0d03da996ab62b  docs/COMPTE-RENDU.md" | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Le lockfile n'est pas à la racine : sans ce chemin, le cache npm ne
          # trouverait rien et se reconstruirait à chaque exécution.
          cache-dependency-path: web/package-lock.json

      # `npm ci` et non `npm install` : le lockfile est committé et fait autorité.
      # C'est lui qui porte les planchers de version non négociables du CLAUDE.md
      # (drizzle-orm ≥ 0.45.2, overrides postcss et sharp).
      #
      # [CI-IGNORE-SCRIPTS] `--ignore-scripts` empêche les scripts d'installation des
      # DÉPENDANCES de s'exécuter sur le runner — la surface par laquelle un paquet compromis
      # lit les secrets du workflow. Mesuré ici avant d'être posé (18/09/2026, Node 22,
      # npm 10.9.7), et la mesure qui compte n'est pas l'install mais le GATE COMPLET :
      # typecheck, tests et build tous verts, `tests/dependances.test.ts` compris — c'est lui
      # qui inspecte TOUTES les copies du lockfile, donc lui qui aurait crié si `--ignore-scripts`
      # avait laissé un arbre incomplet.
      #
      # ⚠️ CE QU'IL FALLAIT VÉRIFIER, ET QUI N'ÉTAIT PAS ÉVIDENT. `@mokarade/hub-contract` est
      # une dépendance GIT (`github:MoKarade/hub-contract#v1.3.0`) : une installation depuis git
      # ne livre aucun `dist/`, c'est le script `prepare` du contrat qui le construit. Un drapeau
      # qui coupe les scripts pouvait donc laisser un paquet SANS `dist/`, et `main`/`module`/
      # `types` pointeraient dans le vide. Mesuré, cache npm VIDE compris : `dist/` est bien là
      # — npm construit une dépendance git au moment de la RÉCUPÉRER, pas au moment d'exécuter
      # les scripts d'installation. Confirmé une seconde fois sur un vrai runner (Hubperso,
      # même dépendance, gate vert). C'est une mesure, pas une déduction : à re-mesurer si npm
      # change de version majeure.
      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # Parmi ces tests, `tests/dependances.test.ts` inspecte TOUTES les copies du
      # lockfile — Next embarque sa propre postcss dans son node_modules, invisible
      # depuis le premier niveau. C'est le verrou des planchers de version ; il ne
      # servait à rien tant qu'aucune CI ne l'exécutait à chaque changement.
      - name: Tests
        run: npm run test

      # Vérifié : le build ne demande AUCUNE variable d'environnement (ni Neon, ni
      # Auth.js, ni la clé Anthropic) — la CI ne réclamera aucun secret.
      - name: Build
        run: npm run build

  audit:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 29 s observe.
    timeout-minutes: 10
    name: Audit des dépendances de production
    runs-on: ubuntu-latest
    # Job SÉPARÉ du gate, volontairement. Ici plus qu'ailleurs : c'est exactement ce
    # job qui aurait signalé l'injection SQL de drizzle-orm, et il l'aurait fait un
    # lundi matin sans qu'aucun commit n'ait eu lieu. Le garder hors du gate évite
    # qu'un dépôt sain devienne « rouge » du jour au lendemain et qu'on prenne
    # l'habitude du rouge — c'est ainsi qu'une CI cesse d'être lue.
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] Idem : ce job installe et interroge `npm audit`, il ne pousse
          # rien. Le jeton n'a aucune raison de rester lisible pour la suite du run.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # [CI-IGNORE-SCRIPTS] Idem — et ici le drapeau ne retire rien du tout : ce job
      # n'exécute que `npm audit`, qui lit l'arbre de dépendances sans rien construire.
      - name: Dépendances
        run: npm ci --ignore-scripts

      # `--omit=dev` → 0, la règle du CLAUDE.md. Les avis `moderate` restants sont
      # dev-only (chaîne esbuild → drizzle-kit, serveur de développement) : ils ne
      # touchent pas la production et `npm audit fix --force` proposerait de
      # rétrograder Next en 9.x, ce qui casserait l'app.
      - name: npm audit (production)
        run: npm audit --omit=dev

# ── Note sur le cron ──────────────────────────────────────────────────────────
# GitHub désactive les workflows planifiés d'un dépôt resté 60 jours sans activité et
# le signale par courriel. Si l'audit hebdomadaire cesse d'apparaître, c'est là qu'il
# faut regarder — pas dans ce fichier.
