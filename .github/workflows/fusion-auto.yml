# Fusion automatique (Atelier) : une PR du dépôt (Dependabot compris) est fusionnée en squash dès que les
# contrôles obligatoires de la protection de master sont verts (gate, qualité, sécurité, audit, SonarCloud),
# SAUF si elle touche un chemin sensible (hooks, .github, réglages, commit-gate, .claude, CODEOWNERS, modeles/,
# migrations et schéma de base) : la décision est celle du modèle de l'Atelier (autoMerge.mjs, peutArmer,
# liste chemins-interdits.json + .github/auto-merge.json). Les PR de fork et les brouillons ne s'arment pas.
#
# pull_request_target : ce workflow, le script et la liste des chemins sont lus sur MASTER, jamais dans la PR
# (une PR ne peut pas s'auto-autoriser en modifiant la liste ou ce fichier). Le code de la PR n'est JAMAIS
# récupéré ni exécuté ici : on ne lit que la liste de ses fichiers par l'API.
# `synchronize` : à chaque poussée on réévalue, et une PR déjà armée qui touche un chemin sensible est désarmée.
name: Fusion automatique

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: fusion-auto-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  activer:
    name: Activer la fusion automatique
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Branche de BASE (défaut de pull_request_target) : jamais le code de la PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Armer ou désarmer selon la décision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/auto-merge/armer.mjs
