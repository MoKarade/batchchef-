# Mises à jour de dépendances proposées automatiquement (porte sécurité de l'Atelier).
# Groupées pour limiter le bruit : une PR par semaine pour les versions mineures/correctives.
# Chaque PR passe par la CI complète (gate, qualité, sécurité) avant toute fusion.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # vitest et @vitest/* exigent la MÊME version (peer exacte) : séparés, chaque PR échoue à
      # l'installation (ERESOLVE, vécu le 23/09). Leurs majeures voyagent donc ensemble.
      vitest-majeures:
        patterns: ["vitest", "@vitest/*"]
        update-types: [major]
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # @types/node suit la MAJEURE de Node déclarée (.nvmrc) : une majeure plus récente se change AVEC
      # Node. Vécu le 23/09/2026 : #113 a fait passer les types en 26 sur un Node 24 (typecheck vert,
      # mais il aurait laissé passer une API de Node 26 absente en production).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest 5 (+ @vitest/*) : le lanceur vitest de Stryker ne sait pas encore le piloter — sous vitest 5
      # le filtre par nom de test ne sélectionne plus rien, chaque mutant « survit » (stryker-js#6210,
      # ouvert). Mesuré ici le 24/09/2026 : score de mutation 40,6 % → 5,2 % sans une ligne de code
      # changée. Retour à vitest 4.1. À retirer quand @stryker-mutator/vitest-runner corrige #6210.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # eslint 10 : eslint-plugin-react (embarqué par eslint-config-next) n'a AUCUNE version compatible —
      # dernière publication 7.37.5 (avril 2025), jsx-eslint/eslint-plugin-react#3977 ouverte. Mesuré le
      # 23/09/2026 (BatchChef #108) : lint en plantage (`Components.componentRule`). À retirer dès qu'une
      # version compatible sort.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 : aucune API programmatique avant la 7.1 (annonce TS 7.0, 08/07/2026) ; typescript-eslint
      # en dépend, et la 7.0 change des défauts (`types` vide, imports à effet de bord vérifiés). Mesuré le
      # 23/09/2026 (JobAI #29) : typecheck rouge. À retirer avec TypeScript 7.1 + typescript-eslint compatible.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Contrat INTERNE, épinglé à la main sur un tag (outils/repin_hub_contract.py de l'Atelier) : pas à
      # Dependabot. Il lisait mal le tag annoté v1.3.1 et proposait une RÉTROGRADATION v1.3.1 -> v1.3.0
      # (sans dist/ : installation cassée) — vécu le 23/09/2026, BatchChef #114 et JobAI #34.
      - dependency-name: "@mokarade/hub-contract"
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
